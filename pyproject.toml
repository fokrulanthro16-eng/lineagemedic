[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages/lineagemedic/src", "apps/api"]
addopts = "-q --strict-markers"
filterwarnings = [
  "error",
  # starlette's TestClient still imports httpx; not actionable from here.
  "ignore::DeprecationWarning",
  "ignore:Using `httpx` with `starlette.testclient`:UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", ".venv-datahub", "node_modules", "apps/web"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF"]
ignore = [
  "B008",   # FastAPI depends() in defaults is idiomatic
  "RUF012", # mutable class attrs are fine on Pydantic models
  # UP042 wants enum.StrEnum, which is 3.11+. The package supports 3.10 so the
  # DataHub CLI's interpreter range stays usable; (str, Enum) is the portable
  # equivalent and serialises identically under Pydantic v2.
  "UP042",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["lineagemedic", "lineagemedic_api"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
mypy_path = "packages/lineagemedic/src:apps/api"
exclude = ["\\.venv", "\\.venv-datahub", "node_modules", "apps/web"]

[[tool.mypy.overrides]]
# Tests favour readability over exhaustive annotation; pytest fixture params
# are inferred. Requires tests/__init__.py so the modules resolve as "tests.*".
module = "tests.*"
disallow_untyped_defs = false
