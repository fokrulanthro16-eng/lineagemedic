[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lineagemedic"
version = "0.1.0"
description = "Diagnose, contain, and heal silent data failures before they break production ML."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "LineageMedic Contributors" }]
keywords = ["datahub", "lineage", "data-quality", "ml-observability", "mcp"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.7,<3",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lineagemedic = ["py.typed", "fixtures/*.json", "data/*.sql"]

# Lint and type-check settings live in the workspace root pyproject.toml.
# Ruff resolves configuration from the *nearest* pyproject to each file, so a
# [tool.ruff] table here would silently shadow the root config for everything
# under this package -- which is exactly how the two drifted apart before.
