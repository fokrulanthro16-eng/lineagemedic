[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lineagemedic-api"
version = "0.1.0"
description = "FastAPI backend for LineageMedic."
requires-python = ">=3.10,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
  "lineagemedic",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11"]

[tool.setuptools.packages.find]
where = ["."]
include = ["lineagemedic_api*"]

# Lint and type-check settings live in the workspace root pyproject.toml.
# See the note in packages/lineagemedic/pyproject.toml: a [tool.ruff] table
# here would shadow the root config for every file under apps/api.
